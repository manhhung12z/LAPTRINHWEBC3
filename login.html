<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="container">
    <h2>ĐĂNG NHẬP</h2>
    <p>Bạn có thể đăng nhập để được hỗ trợ chi tiết hơn.</p>

    <form>
      <label for="username">Tài khoản</label>
      <input type="text" id="username" placeholder="Nhập tài khoản" required>

      <label for="password">Mật khẩu</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu" required>

      <button type="submit">Tiếp tục</button>
    </form>

    <div class="divider">hoặc</div>

    <div class="social">
      <button class="google"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt=""> Google</button>
      <button class="apple"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/apple/apple-original.svg" alt=""> Apple</button>
      <button class="facebook"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/facebook/facebook-original.svg" alt=""> Facebook</button>
    </div>
    <div class="signin">
      <p> "Bạn chưa có tài khoản? "
      <a href="signin.html">Đăng ký</a>
      </p>
    </div>
  </div>
</body>
</html>
