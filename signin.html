<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="container">
    <h2>ĐĂNG KÝ</h2>
    <p>Vui lòng nhập đầy đủ thông tin</p>
    <form>
      <label for="username">Tài khoản</label>
      <input type="text" id="username" placeholder="Nhập tài khoản đăng ký" required>
      <label for="password">Mật khẩu</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu" required>
      <label for="password">Nhập lại mật khẩu</label>
      <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu" required>

      <button type="submit">Hoàn tất</button>
    </form>

    <div class="divider">hoặc</div>

    <div class="login">
      <p> "Bạn đã có tài khoản? "
      <a href="login.html">Đăng nhập</a>
      </p>
    </div>
  </div>
</body>
</html>
